services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: gradeplanner
      POSTGRES_USER: gradeplanner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Lipseste POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gradeplanner -d gradeplanner"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:

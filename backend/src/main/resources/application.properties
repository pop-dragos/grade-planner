spring.application.name=backend

# Local: citeste ../.env (radacina repo-ului), acelasi fisier folosit de Docker Compose.
# "optional:" = daca fisierul nu exista (ex. in container), nu e eroare.
spring.config.import=optional:file:../.env[.properties]

# Conexiunea la baza de date. ${VAR:implicit} = ia variabila de mediu VAR, altfel valoarea implicita.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/gradeplanner}
spring.datasource.username=${DB_USER:gradeplanner}
spring.datasource.password=${POSTGRES_PASSWORD}

# Flyway creeaza schema; Hibernate doar verifica ca entitatile se potrivesc cu ea.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Anti N+1: cand se acceseaza colectii LAZY (ex. componentele), Hibernate le incarca pentru
# pana la 50 de materii intr-un singur query (WHERE course_id IN (...)), nu cate un query pe materie.
spring.jpa.properties.hibernate.default_batch_fetch_size=50
